name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: PRs into main must come from dev
        if: github.event_name == 'pull_request' && github.head_ref != 'dev'
        run: |
          echo "::error::Only 'dev' may open PRs into 'main' (head was '${{ github.head_ref }}')."
          exit 1

  no-breaking-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No estamos en v1 todavía (ver .releaserc.json / semantic-release):
      # un commit con "!" tras el tipo o un footer BREAKING CHANGE: salta
      # directo a 1.0.0 en el próximo release a main. Bloqueado hasta que
      # se decida cerrar v1 a propósito.
      - name: Block breaking-change commits before v1
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BANG_MATCHES=$(git log "$BASE_SHA..$HEAD_SHA" --format='%H %s' | grep -E '^[0-9a-f]+ [a-z]+(\([^)]*\))?!:' || true)
          FOOTER_MATCHES=$(git log "$BASE_SHA..$HEAD_SHA" --format='commit %H%n%B' | grep -B5 'BREAKING CHANGE:' || true)

          if [ -n "$BANG_MATCHES" ] || [ -n "$FOOTER_MATCHES" ]; then
            echo "::error::Se encontró un commit marcado como breaking change (tipo!: o footer BREAKING CHANGE:). Eso saltaría a la versión 1.0.0 en el próximo release — sacá la marca, o si es a propósito, avisá explícitamente antes de mergear."
            echo "$BANG_MATCHES"
            echo "$FOOTER_MATCHES"
            exit 1
          fi

  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test:run
      - run: pnpm run build
        env:
          VITE_API_URL: https://example.invalid
